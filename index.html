<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>鯖あてゲーム</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#183047;font-family:system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:16px}h1{margin:0 0 8px}p{margin:8px 0}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default}.panel{background:white;border:1px solid #d5dfe8;border-radius:12px;padding:16px;margin:12px 0}.bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.primary{background:#155e75;color:white;border:0;border-radius:6px;padding:9px 18px}input{width:90px;padding:6px}#board{display:grid;grid-template-columns:repeat(var(--n),minmax(22px,1fr));width:max(100%,calc(var(--n)*22px));gap:0;background:white}#scroll{overflow:auto;max-height:75vh;border:1px solid #d5dfe8}#board button{aspect-ratio:1;border:0;border-right:1px solid #edf1f4;border-bottom:1px solid #edf1f4;background:white;color:#172635;padding:0;font-size:clamp(13px,1.4vw,22px);line-height:1;font-family:'Yu Gothic','Hiragino Kaku Gothic ProN',sans-serif}#board button:hover{background:#e0f2fe}#board button.wrong{background:#fecaca}#board button.right{background:#286b9b;color:#fff;animation:correct-blink 240ms steps(1,end) 3}@keyframes correct-blink{0%,100%{background:#286b9b;color:#fff}50%{background:white;color:#172635}}@media(prefers-reduced-motion:reduce){#board button.right{animation:none}}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:6px;border-bottom:1px solid #ddd}[hidden]{display:none!important}.muted{color:#526777;font-size:.9rem}

body.playing main{height:100dvh;display:flex;flex-direction:column;padding:8px;overflow:hidden}body.playing main>h1,body.playing main>p,body.playing #setup,body.playing #rankPanel{display:none}#play{min-height:0;flex:1;display:flex;flex-direction:column}#play .panel{flex:none;margin:0 0 8px;padding:8px;gap:6px 14px}#scroll{flex:1;min-height:0;max-height:none;overflow:hidden;display:flex;align-items:center;justify-content:center;border:0;container-type:size}#board{width:min(100cqw,100cqh,900px);height:min(100cqw,100cqh,900px);grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--n),minmax(0,1fr));border:1px solid #d5dfe8;flex:none}#board button{aspect-ratio:auto;min-width:0;min-height:0;font-size:calc(min(100cqw,100cqh,900px) / var(--n) * .68);touch-action:manipulation;overflow:hidden}@media(max-width:500px){#play .panel{font-size:13px;gap:5px 10px}}
#round{font-size:clamp(1.5rem,4vw,2.5rem);line-height:1.15;font-weight:800;white-space:nowrap}

#play .play-header{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;gap:5px;padding:6px 8px;margin-bottom:6px}
.play-stats{display:flex;justify-content:center;align-items:center;gap:clamp(5px,2vw,22px);width:100%;font-size:clamp(10px,3.1vw,16px);font-variant-numeric:tabular-nums;white-space:nowrap}
.play-stats strong{display:inline-block;min-width:5.5ch;text-align:right}.play-stats #miss{min-width:2ch}
#quit{padding:4px 24px;border:1px solid #b9c9d6;border-radius:6px;background:#fff;color:#183047}
.result-hero{position:relative;overflow:hidden;text-align:center;border-radius:12px;padding:24px 12px;background:linear-gradient(135deg,#123952,#286b9b);color:#fff;margin-bottom:16px;isolation:isolate}
.result-hero h2{position:relative;margin:8px 0;font-size:clamp(26px,6vw,44px);letter-spacing:.08em}.result-hero p{position:relative;margin:4px 0}.result-time{position:relative;font-size:clamp(36px,9vw,64px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}.result-time small{font-size:.35em}.result-kicker{letter-spacing:.2em;font-weight:700;color:#c9eaff}.result-best{display:inline-block;position:relative;background:#ffdf85;color:#183047;border-radius:20px;padding:5px 15px;font-weight:800;margin-top:12px}.result-hero .particle{position:absolute;top:-15px;left:var(--x);width:var(--w);height:var(--w);background:var(--color);border-radius:2px;pointer-events:none;animation:celebrate var(--duration) var(--delay) ease-out both;z-index:-1}.result-animate .result-hero{animation:hero-in .5s ease-out both}.result-animate .result-time{animation:time-in .65s .25s ease-out both}.result-animate .result-details{animation:hero-in .5s .8s ease-out both}@keyframes celebrate{0%{transform:translateY(-10px) rotate(0);opacity:0}12%{opacity:.85}100%{transform:translate(var(--drift),280px) rotate(420deg);opacity:0}}@keyframes hero-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes time-in{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){.result-animate .result-hero,.result-animate .result-time,.result-animate .result-details{animation:none}.result-hero .particle{display:none}}

.title-header{text-align:center;margin:18px 0 24px}.title-header h1{font-size:clamp(2.5rem,8vw,4.5rem);line-height:1.15;letter-spacing:.04em;margin:0;color:#183047}.version{font-size:.8rem;color:#526777;margin:6px 0 0}.game-description{text-align:center;line-height:1.8;margin:0 0 20px}.home-content{max-width:680px;margin:0 auto}#setup{display:flex;flex-direction:column;gap:16px}#setup h2,#rankPanel h2{margin:0 0 8px;font-size:1.3rem}.settings-inner{border:1px solid #d5dfe8;border-radius:8px;padding:16px;background:#f4f7fa}.settings-inner label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.settings-inner p{margin:8px 0 0}#start{width:100%;font-size:clamp(1.3rem,5vw,1.8rem);font-weight:800;padding:16px;border-radius:10px;background:#286b9b}body.playing .title-header,body.playing .game-description,body.playing .home-content{display:none}#rankPanel{max-width:680px;margin:12px auto}
</style></head><body><main>
<header class="title-header"><h1>鯖あてゲーム</h1><p class="version">Ver.0.8</p></header>
<p class="game-description">魚へんの漢字の中から、ただ一つの「鯖」を探せ！<br>全10回の合計タイムで競う。</p>
<div class="home-content"><section id="setup" class="panel"><div><h2>設定</h2><div class="settings-inner"><label>盤面サイズ（N × N） <input id="size" type="number" min="2" max="100" value="5" step="1"></label><p class="muted">盤面全体を画面内に表示します。</p></div></div><button class="primary" id="start">ゲーム開始</button></section></div>
<section id="play" hidden><div class="panel play-header"><strong id="round"></strong><div class="play-stats"><span>経過 <strong id="clock">0.000</strong> 秒</span><span>累計 <strong id="total">0.000</strong> 秒</span><span>ミス <strong id="miss">0</strong></span></div><button id="quit">中断</button></div><div id="scroll"><div id="board" aria-label="魚へんの漢字盤面"></div></div></section>
<section class="panel" id="result" hidden><div class="result-hero" id="resultHero"><p class="result-kicker">ALL 10 ROUNDS CLEAR</p><h2>クリア！</h2><p>合計タイム</p><div class="result-time"><span id="resultTime"></span> <small>秒</small></div><p id="resultMiss"></p><div class="result-best" id="resultBest" hidden>自己ベスト更新！</div></div><div class="result-details"><h2>リザルト</h2><p id="summary"></p><table><thead><tr><th>回</th><th>タイム（秒）</th><th>ミス数</th></tr></thead><tbody id="times"></tbody></table></div></section>
<section id="rankPanel" class="panel"><h2>端末内ランキング</h2><p class="muted">盤面サイズ別・上位10件。合計タイムが短い順、同タイムならミス数が少ない順。このブラウザ内のみ保存されます。</p><p id="rankTitle"></p><table><thead><tr><th>順位</th><th>合計タイム</th><th>ミス</th></tr></thead><tbody id="ranking"></tbody></table></section>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
const fish=Array.from('鮭鮪鯛鯉鮎鰯鰹鰤鰻鱈鯵鱒鮫鯨鮒鰆鱧鰈鮃鮑鰐鯰鱗鰭鮮鯔鱚鯒鰍鮠鰊鱸');
const MAX_ROUNDS=10, KEY='saba-game-ranking-v1';
let state=null, frame=0, transition=0;
const fmt=ms=>(ms/1000).toFixed(3);
function compareScores(a,b){return Math.round(a.ms)-Math.round(b.ms)||a.miss-b.miss}
function readScores(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch{return []}}
function sizeValue(){const n=Number($('size').value);return Number.isInteger(n)&&n>=2&&n<=100?n:null}
function renderRanking(n){$('rankTitle').textContent=n?`${n} × ${n}`:'有効なサイズを入力してください';const rows=readScores().filter(x=>x.n===n).sort(compareScores).slice(0,10);$('ranking').replaceChildren(...rows.map((x,i)=>makeRow([i+1,fmt(x.ms)+' 秒',x.miss])));if(!rows.length)$('ranking').append(makeRow(['—','記録なし','—']))}
function makeRow(values){const tr=document.createElement('tr');for(const value of values){const td=document.createElement('td');td.textContent=value;tr.append(td)}return tr}
function start(){const n=sizeValue();if(!n){alert('2〜100の整数を入力してください');return}stop();state={n,round:0,times:[],roundMisses:[],roundMiss:0,miss:0,start:0,active:false,previousTarget:null};$('size').disabled=true;$('start').disabled=true;$('result').hidden=true;$('play').hidden=false;document.body.classList.add('playing');renderRanking(n);nextRound()}
function stop(){cancelAnimationFrame(frame);clearTimeout(transition);if(state)state.active=false;state=null;document.body.classList.remove('playing');$('play').hidden=true;$('start').disabled=false;$('size').disabled=false}
function chooseTarget(count,previous){if(previous===null)return Math.floor(Math.random()*count);const index=Math.floor(Math.random()*(count-1));return index>=previous?index+1:index}
function nextRound(){state.round++;state.roundMiss=0;state.active=false;const count=state.n**2,target=chooseTarget(count,state.previousTarget),frag=document.createDocumentFragment();state.previousTarget=target;for(let i=0;i<count;i++){const b=document.createElement('button');b.type='button';b.textContent=i===target?'鯖':fish[Math.floor(Math.random()*fish.length)];frag.append(b)}$('board').style.setProperty('--n',state.n);$('board').replaceChildren(frag);$('scroll').scrollTo(0,0);$('round').textContent=`第 ${state.round} / ${MAX_ROUNDS} 回`;$('clock').textContent='0.000';$('total').textContent=fmt(state.times.reduce((a,b)=>a+b,0));$('miss').textContent=state.miss;frame=requestAnimationFrame(()=>{frame=requestAnimationFrame(()=>{if(!state)return;state.start=performance.now();state.active=true;tick()})})}
function tick(){if(!state?.active)return;$('clock').textContent=fmt(performance.now()-state.start);frame=requestAnimationFrame(tick)}
function selectCell(e){const b=e.target.closest('button');if(!b||!state?.active)return;if(b.textContent!=='鯖'){state.miss++;state.roundMiss++;$('miss').textContent=state.miss;b.classList.add('wrong');return}const elapsed=performance.now()-state.start;state.active=false;cancelAnimationFrame(frame);state.times.push(elapsed);state.roundMisses.push(state.roundMiss);$('clock').textContent=fmt(elapsed);$('total').textContent=fmt(state.times.reduce((a,b)=>a+b,0));b.classList.add('right');transition=setTimeout(()=>{if(state.round===MAX_ROUNDS)finish();else nextRound()},720)}
function celebrateResult(ms,miss,best){
 const result=$('result'),hero=$('resultHero');
 hero.querySelectorAll('.particle').forEach(p=>p.remove());
 $('resultTime').textContent=fmt(ms);$('resultMiss').textContent=`ミス ${miss} 回`;$('resultBest').hidden=!best;
 const colors=['#d5edff','#7ac4ee','#ffffff','#ffdf85','#76a9d0'];
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches){for(let i=0;i<36;i++){const p=document.createElement('i');p.className='particle';p.setAttribute('aria-hidden','true');p.style.cssText=`--x:${Math.random()*100}%;--w:${4+Math.random()*7}px;--color:${colors[i%colors.length]};--duration:${1.1+Math.random()*1.2}s;--delay:${Math.random()*.5}s;--drift:${Math.random()*100-50}px`;hero.append(p);p.addEventListener('animationend',()=>p.remove(),{once:true})}}
 result.classList.remove('result-animate');void result.offsetWidth;result.classList.add('result-animate');result.scrollIntoView({block:'start',behavior:'auto'});
}
function finish(){const {n,times,roundMisses,miss}=state,ms=times.reduce((a,b)=>a+b,0);const previous=readScores().filter(x=>x.n===n).sort(compareScores)[0];const best=!previous||compareScores({ms,miss},previous)<0;let saved=true;try{const all=readScores();all.push({n,ms,miss});const top=all.filter(x=>x.n===n).sort(compareScores).slice(0,10);localStorage.setItem(KEY,JSON.stringify([...all.filter(x=>x.n!==n),...top]))}catch{saved=false}stop();$('summary').textContent=`${n} × ${n} ／ 合計 ${fmt(ms)} 秒 ／ ミス ${miss} 回${saved?'':' ／ 記録を保存できませんでした'}`;$('times').replaceChildren(...times.map((t,i)=>makeRow([i+1,fmt(t),roundMisses[i]])));$('result').hidden=false;renderRanking(n);celebrateResult(ms,miss,best&&saved)}
$('start').addEventListener('click',start);$('quit').addEventListener('click',stop);$('board').addEventListener('click',selectCell);$('size').addEventListener('input',()=>renderRanking(sizeValue()));renderRanking(5);
</script></body></html>
